services:
  postgres:
    image: postgres:16-alpine
    container_name: learnio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learnio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnio-network

  # Backend (development, hot reload) - default for `docker compose up`
  backend:
    image: node:20-alpine
    container_name: learnio-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnio}?schema=public
      - PORT=3000
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=http://localhost:5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnio-network
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  # Frontend (development, hot reload) - default for `docker compose up`
  frontend:
    image: node:20-alpine
    container_name: learnio-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Keep dependencies inside Docker volume (faster + avoids host FS watcher issues)
      - frontend_node_modules:/app/node_modules
    networks:
      - learnio-network
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

  # Backend (production) - run with: docker compose --profile prod up --build
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: learnio-backend-prod
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnio}?schema=public
      - PORT=${PORT:-3000}
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnio-network
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (production build served by nginx) - run with: docker compose --profile prod up --build
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: learnio-frontend-prod
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - backend-prod
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - learnio-network

  # PgAdmin (optional tooling)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learnio-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@learnio.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - learnio-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  learnio-network:
    driver: bridge
