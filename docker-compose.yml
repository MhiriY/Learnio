services:
  postgres:
    image: postgres:16-alpine
    container_name: learnio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learnio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnio-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learnio-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@learnio.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - learnio-network
    depends_on:
      - postgres

  # Production service - built from Dockerfile, no volume mounts
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: learnio-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnio}?schema=public
      - PORT=${PORT:-3000}
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnio-network

  # Development service - uses volume mounts, no image build
  backend-dev:
    image: node:20-alpine
    container_name: learnio-backend-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnio}?schema=public
      - PORT=${PORT:-3000}
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnio-network
    volumes:
      - ./backend:/app
      - ./backend/node_modules:/app/node_modules
    command: sh -c "npx prisma generate && npm run start:dev"

volumes:
  postgres_data:
  pgadmin_data:

networks:
  learnio-network:
    driver: bridge
