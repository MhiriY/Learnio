services:
  postgres:
    image: postgres:16-alpine
    container_name: learnio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learnio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnio-network

  # Backend (production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: learnio-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnio}?schema=public
      - PORT=${PORT:-3000}
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnio-network
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (static build served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: learnio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Keep host port 5173 so backend CORS default works out of the box.
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - learnio-network

  # PgAdmin (optional tooling)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learnio-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@learnio.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - learnio-network
    depends_on:
      - postgres

  # Backend (development, hot reload) - run with: docker compose --profile dev up
  backend-dev:
    image: node:20-alpine
    container_name: learnio-backend-dev
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "${DEV_BACKEND_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnio}?schema=public
      - PORT=3000
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_URL=http://localhost:5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnio-network
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate && npm run start:dev"

volumes:
  postgres_data:
  pgadmin_data:
  backend_node_modules:

networks:
  learnio-network:
    driver: bridge
